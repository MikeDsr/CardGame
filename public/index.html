<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1021">
<title>聚会卡堂 · 掌上桌游合集</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 大厅 -->
  <section id="scr-lobby" class="screen active">
    <div class="lobby-bg"></div>
    <header class="lobby-head">
      <h1 class="logo">聚会<span>卡堂</span></h1>
      <p class="slogan">五款经典桌游 · 随时随地，和朋友面对面开玩</p>
    </header>
    <div class="name-row">
      <span class="name-label">我的昵称</span>
      <input id="inp-name" maxlength="8" placeholder="输入昵称">
      <button id="btn-dice-name" class="mini-btn" title="随机昵称">🎲</button>
    </div>
    <div id="game-grid" class="game-grid"></div>
    <footer class="lobby-foot">
      <button id="btn-settings" class="ghost-btn">⚙️ 联机设置</button>
      <button id="btn-help" class="ghost-btn">📖 玩法帮助</button>
    </footer>
  </section>

  <!-- 房间 -->
  <section id="scr-room" class="screen">
    <div class="room-wrap">
      <h2 id="room-title">房间</h2>
      <div class="room-code-box">
        <span>房间号</span>
        <b id="room-code">----</b>
        <button id="btn-copy-code" class="mini-btn">复制</button>
      </div>
      <p class="room-tip" id="room-tip">把房间号告诉好友，让他们在大厅点「加入房间」</p>
      <div id="seat-list" class="seat-list"></div>
      <div class="room-btns">
        <button id="btn-add-bot" class="sec-btn">🤖 添加机器人</button>
        <button id="btn-del-bot" class="sec-btn">➖ 移除机器人</button>
      </div>
      <div class="room-btns">
        <button id="btn-start" class="main-btn">🚀 开始游戏</button>
        <button id="btn-leave-room" class="ghost-btn">离开房间</button>
      </div>
    </div>
  </section>

  <!-- 游戏 -->
  <section id="scr-game" class="screen">
    <div id="game-top">
      <button id="btn-exit-game" class="top-btn">✕ 退出</button>
      <span id="game-title"></span>
      <button id="btn-sound" class="top-btn">🔊</button>
    </div>
    <div id="game-root"></div>
  </section>
</div>

<div id="toast-box"></div>
<div id="modal-layer" class="hidden"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
